name: Testar FoodStock
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - run: deno check supabase/functions/recognize-food/index.ts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: FOODSTOCK_BROWSER=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())") npm run test:browser
