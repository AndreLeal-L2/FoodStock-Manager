name: Front-end no GitHub Pages
on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/build-vision.mjs', 'scripts/vision-entry.mjs', 'scripts/ocr-entry.mjs', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:vision
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
