name: Recuperar publicação Pages interrompida
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages-recovery.yml']
permissions:
  pages: write
jobs:
  cancel-stale-deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Libertar a tentativa que bloqueia a publicação
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pages_endpoint="repos/$GITHUB_REPOSITORY/pages/deployments/35028e25d2404781afc73fb5a44f6767901e2485"
          pages_status=$(gh api "$pages_endpoint" --jq '.status')
          case "$pages_status" in
            succeed|deployment_cancelled|deployment_failed|deployment_perms_error|deployment_content_failed|deployment_lost)
              echo "::notice title=Pages recovery::$pages_status"
              exit 0
              ;;
          esac
          gh api --method POST "$pages_endpoint/cancel" --silent
          for pages_attempt in {1..12}; do
            pages_status=$(gh api "$pages_endpoint" --jq '.status')
            case "$pages_status" in
              succeed|deployment_cancelled|deployment_failed|deployment_perms_error|deployment_content_failed|deployment_lost)
                echo "::notice title=Pages recovery::$pages_status"
                exit 0
                ;;
            esac
            sleep 5
          done
          echo "::error title=Pages recovery::The deployment remained $pages_status after cancellation."
          exit 1
